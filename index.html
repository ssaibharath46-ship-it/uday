<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Portal - Student Report System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="brand-logo">SR</div>
      <div><b>STUDENT REPORT</b><small>ADMIN PORTAL</small></div>
    </div>

    <div class="admin-profile">
      <div class="avatar">A</div>
      <div><b>Administrator</b><small>System Admin</small></div>
    </div>

    <p class="menu-title">MAIN MENU</p>
    <nav>
      <button class="nav active" data-page="dashboard">📊 <span>Dashboard</span></button>
      <button class="nav" data-page="students">👨‍🎓 <span>Students</span></button>
      <button class="nav" data-page="attendance">📅 <span>Attendance</span></button>
      <button class="nav" data-page="results">📈 <span>Results</span></button>
      <button class="nav" data-page="assignments">📝 <span>Assignments</span></button>
      <button class="nav" data-page="fees">💳 <span>Fee Details</span></button>
      <button class="nav" data-page="notices">📢 <span>Notices</span></button>
      <button class="nav" data-page="reports">📄 <span>Reports</span></button>
    </nav>

    <p class="menu-title">SYSTEM</p>
    <nav>
      <button class="nav" data-page="settings">⚙️ <span>Settings</span></button>
      <button class="nav" onclick="logout()">🚪 <span>Logout</span></button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Admin Dashboard</h1>
        <p>Manage students and academic performance</p>
      </div>
      <div class="top-actions">
        <button class="icon-btn">🔔<i></i></button>
        <div class="top-user"><div class="mini-avatar">A</div><b>Administrator</b></div>
      </div>
    </header>

    <section id="content"></section>
  </main>
</div>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
